</head>

<body>
  <script>
    function karkausvuosi(year) {
      if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
        return true;
      } else {
        return false;
      }

    }
    const year = 1992;
    karkausvuosi(year)

    if (karkausvuosi(year)) {
      console.log(`${year} on karkausvuosi.`)
    } else {
      console.log(`${year} ei ole karkausvuosi.`)
    }

  </script>
</body>

</html>

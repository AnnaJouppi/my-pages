<body>
  <script>
    function display_numbers(a, b, c) {
      if (a > b && a > c) {
        console.log(`${a} is the biggest number!`)
      }
      else if (b > a && b > c) {
        console.log(`${b} is the biggest number!`)
      }
      else {
        console.log(`${c} is the biggest number!`)
      }

      console.log(`Numbers are: ${a}, ${b}, ${c}. !`)
    }
    let number1 = 3;
    let number2 = 45;
    let number3 = 16;
    display_numbers(number1, number2, number3);

  </script>

</body>

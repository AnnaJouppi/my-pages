<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tehtävä 5</title>
</head>

<body>
  <script>
    function evenodd(array) {
      console.log(`Alkuperäinen taulukko: ${array}`);
      // Etsitään parilliset numerot
      const evenNumbers = array.filter(number => number % 2 === 0);
      console.log(`Parillinen taulukko: ${evenNumbers}`)
      // Etsitään parittomat
      const oddNumbers = array.filter(number => number % 2 > 0);
      console.log(`Pariton taulukko: ${oddNumbers}`)
    }
    const numbers = [3, 62, 76, 10, 8, 9, 35, 78];
    evenodd(numbers);

  </script>
</body>

</html>

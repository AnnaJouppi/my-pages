<body>
  <script>
    const fruits = {
      apple: 3,
      banana: 5,
      orange: 2,
      grape: 1
    }

    const totalFruits = Object.values(fruits).reduce((sum, count) => sum + count, 0);

    console.log(`Fruits count is: ${totalFruits}`);
  </script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tehtävä 5</title>
</head>

<body>
  <script>
    const circle = {
      radius: 5,
      color: "red",
      getCircumference: function () {
        return 2 * Math.PI * this.radius;
      },
      getArea: function () {
        return Math.PI * this.radius * this.radius;
      },
    };

    console.log(`Circle radius is ${circle.radius} and its color is ${circle.color}`);
    console.log(`Circle area is : ${circle.getArea().toFixed(2)}`);
    console.log(`Circle circumference is : ${circle.getCircumference().toFixed(2)}`);
  </script>
</body>

</html>

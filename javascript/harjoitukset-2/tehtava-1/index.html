<html lang="en">
<head>

</head>
<body>
    <div class="container" >
    <h1>Information</h1>
    <form id="form">
        <div class="name">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <div class="age">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age">
        </div>
        <button type="button" onclick="printResults(form.name.value, form.age.value)">Show</button>
    </form>
    <div id="results" ></div>
    </div>
    <script src="script.js"></script>
</body>
